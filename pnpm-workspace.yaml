packages:
  - 'apps/*'
  - 'configurations/*'
  - 'packages/*'

# pnpm 11 refuses to run a dependency's install scripts unless it is listed here
# (`allowBuilds`; pre-11 this key was `onlyBuiltDependencies`). Each of these
# needs its postinstall to produce a working native binary:
#   esbuild       — the binary tsx and vitest execute
#   sharp         — libvips bindings for next/image optimisation
#   unrs-resolver — native resolver used by eslint-plugin-import
# Anything not listed stays unbuilt, which is the point: a new transitive
# dependency cannot run code at install time without a deliberate edit here.
allowBuilds:
  # The local Postgres behind `pnpm db:local`. Denied: its postinstall only links the ICU
  # libraries (`libicu*.so.60 -> .so.60.2`), and scripts/local-pg.mjs makes the same links
  # from the package's own manifest on `start`.
  '@embedded-postgres/linux-x64': false
  # Native file watcher for `nest start --watch`; falls back to polling without it.
  '@parcel/watcher': true
  # Analytics beacon pulled in transitively. Denied — nothing needs it to run.
  '@scarf/scarf': false
  esbuild: true
  sharp: true
  unrs-resolver: true

# Security overrides: a transitive dependency with a known advisory, which the package that
# pulls it in has not moved past yet. Dependabot cannot make these updates by itself
# (`security_update_not_possible`) because no direct dependency of ours names them.
#
# Each key is scoped to the VULNERABLE RANGE, so it forces nothing that is already safe and
# never crosses a major version. Each one is a debt: when the parent catches up, the entry
# stops matching anything and should be deleted — `pnpm why <package>` says whether it does.
#
#   brace-expansion, js-yaml   — denial of service on crafted input (via eslint, glob, …)
#   browserslist, baseline-…   — unbounded memory / a crash on an untrusted config
#   multer                     — denial of service on multipart bodies, and since 2.5.0 a second one
#                                through a `fileFilter` still running after the request is gone
#                                (GHSA-q7qp-rjg7-q26m); both via @nestjs/platform-express, which
#                                pins `multer: 2.4.0` exactly, so no lockfile refresh can move it
#   vite, esbuild, @babel/core — the dev server and the build toolchain
#   smol-toml                  — development only
#   qs                         — `qs.stringify` with `arrayFormat: 'comma'` throws an uncaught
#                                TypeError on an array element whose own `toString` is not callable
#                                (GHSA-6pq8-jhm2-2vcw). Express's own copy; `body-parser` already
#                                pulls the patched one, so this only lifts the one express pins
#   source-map-js              — event-loop denial of service through indexed section offsets
#   zod                        — memory exhausted validating oversized constrained collections;
#                                the copy is `@vercel/oidc`'s, under `@vercel/blob`, not ours
#   vite@>=8.3.0 <8.3.3        — its bundled `launch-editor` opens a file from the dev server;
#                                the three advisories are Windows-only and dev-server-only
#   esbuild@<=0.24.2           — drizzle-kit's loader pins 0.18; the advisory is about esbuild's
#                                dev server, which drizzle-kit never starts. Checked:
#                                `pnpm --filter database generate` still runs on 0.25.
#
# NOT overridden, on purpose — `glob` (GHSA-3g3m-2fjr-6pw4, moderate): an `AbortSignal` is not
# honoured, so a traversal carries on after its own timeout. The advisory covers everything up to
# 14.0.1 and is fixed only in 14.0.2, and every consumer here declares `^13.0.6` (`@jest/reporters`,
# `jest-config`, `jest-runtime`, `@sentry/bundler-plugins`) or `^10.4.1` (`test-exclude`). An entry
# would therefore cross a major for all of them and put jest's test discovery and coverage on a
# version nobody declared — which this block's second rule forbids, and for more than style: a
# discovery that quietly matches nothing reads as a green run with no tests in it. Nothing here
# calls `glob` itself or passes it a signal, so the finding does not reach this product. Revisit
# when jest and `@sentry/bundler-plugins` declare `^14`; dismissing the alert is the owner's call.
#
# NOT overridden either, and for a reason no entry can get around — `minimatch`
# (GHSA-g3hv-75wg-m249, moderate): a crafted pattern amplifies through `globParts` into a denial
# of service. Vulnerable below 11.0.1, which is every copy here but `3.1.5`, and the consumers
# declare `^9.0.4` (`glob@10.5.0`), `^10.2.2` (`glob@13.0.6`, `@typescript-eslint/typescript-estree`,
# `test-exclude`) — and `@nestjs/cli` pins **`10.2.6` exactly**, so an override scoped to the
# vulnerable range cannot satisfy it at all, never mind without crossing a major. The exact pin
# survived the dependency group of 2026-11-05: `12.0.8` pinned it, `12.0.11` pins the same version,
# and neither advisory moved with the group — `glob` is still `10.5.0` and `13.0.6`, `minimatch`
# still `3.1.5`, `9.0.9` and `10.2.6`. What the advisory
# needs is an attacker-supplied *pattern*: every pattern in this repository is ours — jest's
# `testMatch`, eslint's globs, Sentry's sourcemap upload — and none comes from a request or from
# anything a person types. So the amplification has no way in. Revisit when `@nestjs/cli` and
# `typescript-eslint` move; like `glob`, dismissing the alert is the owner's call and not an agent's.
#
# And a third one, which no entry could close even if it were willing to cross a major —
# `deepmerge` (GHSA-gcqx-w48m-w2h4, low): `mergeObject()` lets a crafted key poison the prototype
# of the object it returns. The vulnerable range is `>= 4.2.0, <= 4.3.1` and **4.3.1 is the newest
# version published**, so the advisory's own `first_patched_version` is `null` — there is nothing
# for an override to point at, in any range. One copy, `jest-config@30.5.2`'s, declared `^4.3.1`,
# and what it merges is this repository's own jest configuration: objects that are files in this
# tree, never a request body and never anything a person types, so no attacker-controlled key
# reaches the call. With `glob` and `minimatch` above, this accounts for all three alerts GitHub
# counts open on `main`. Revisit if a `4.3.2` is ever published; until then the only way to clear
# it is a dismissal, which is the owner's call.
overrides:
  'brace-expansion@<1.1.18': '^1.1.18'
  'brace-expansion@>=2.0.0 <2.1.4': '^2.1.4'
  'brace-expansion@>=4.0.0 <5.0.12': '^5.0.12'
  'browserslist@<4.28.7': '^4.28.7'
  'baseline-browser-mapping@<2.11.0': '^2.11.0'
  'js-yaml@>=4.0.0 <4.3.2': '^4.3.2'
  'multer@<2.5.0': '^2.5.0'
  'qs@>=6.7.0 <=6.16.0': '^6.16.1'
  'smol-toml@<1.7.1': '^1.7.1'
  'source-map-js@<1.2.2': '^1.2.2'
  'vite@>=8.0.0 <8.0.16': '^8.0.16'
  'vite@>=8.3.0 <8.3.3': '^8.3.3'
  '@babel/core@<7.29.6': '^7.29.6'
  'esbuild@>=0.27.3 <0.28.1': '^0.28.1'
  'esbuild@<=0.24.2': '^0.25.0'
  'zod@>=4.0.0 <4.6.6': '^4.6.6'

minimumReleaseAgeExclude:
  - '@better-auth/core@1.7.3'
  - '@better-auth/drizzle-adapter@1.7.3'
  - '@better-auth/kysely-adapter@1.7.3'
  - '@better-auth/memory-adapter@1.7.3'
  - '@better-auth/mongo-adapter@1.7.3'
  - '@better-auth/prisma-adapter@1.7.3'
  - '@better-auth/telemetry@1.7.3'
  - better-auth@1.7.3
  - '@ai-sdk/openai-compatible@3.0.48'
  - '@ai-sdk/provider-utils@5.0.40'
  - '@ai-sdk/provider@4.0.14'
